<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <!-- Locked viewport: RUN games are fullscreen mobile apps; never let the page zoom or scroll. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Meh Fighter</title>
    <!-- The loading screen's own pictures, fetched at once so its panel and bar never pop in. -->
    <link rel="preload" as="image" href="images/ui/frame6.png" />
    <link rel="preload" as="image" href="images/ui/bar1.png" />
    <link rel="preload" as="image" href="images/ui/bar2.png" />
    <link rel="preload" as="image" href="images/logo.png" />
    <style>
        /* Boot cover: inlined (not in the bundle's CSS) so the screen is black
           from the very first paint, before any JS or bundled CSS loads. */
        #boot-cover {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #000;
            opacity: 1;
            transition: opacity 0.35s ease-out;
            pointer-events: none; /* if boot hangs, taps still reach the app */
        }
        #boot-cover.hidden { opacity: 0; }
    </style>
</head>
<body>
    <div id="boot-cover"></div>
    <script src="./boot-cover.js"></script>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
</body>
</html>
